name: App Deploy

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "k8s/**"
      - ".github/workflows/app-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CLUSTER_NAME: project-bedrock-cluster
  NAMESPACE: retail-app
  CHART_VERSION: "1.6.2"
  REGION: us-east-1

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Helm lint values
        run: |
          helm lint helm/ --values helm/values.yaml 2>/dev/null || \
          echo "Lint complete (no chart to lint — values file only)"

      - name: Validate Kubernetes manifests
        run: |
          # Check YAML syntax on all manifests
          for f in k8s/*.yaml; do
            echo "Validating $f..."
            python3 -c "import yaml, sys; list(yaml.safe_load_all(open('$f')))" \
              && echo "  ✓ $f" \
              || { echo "  ✗ $f — invalid YAML"; exit 1; }
          done
          echo "All manifests valid ✓"

      - name: Post validation result to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: `## App Manifest Validation\n**Status:** ✅ All manifests valid\n**Commit:** \`${{ github.sha }}\`\n\nMerging will deploy retail-store v${{ env.CHART_VERSION }} to \`${{ env.NAMESPACE }}\`.`
            });

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: validate
    environment: prod
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.REGION }} \
            --name ${{ env.CLUSTER_NAME }}
          kubectl get nodes

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create retail-app namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      # - name: Create Kubernetes Secrets from AWS Secrets Manager
      #   run: |
      #     # MySQL secret for catalog service
      #     MYSQL_SECRET=$(aws secretsmanager get-secret-value \
      #       --secret-id "project-bedrock/mysql" \
      #       --region ${{ env.REGION }} \
      #       --query SecretString --output text)

      #     kubectl create secret generic retail-store-catalog-db \
      #       --namespace ${{ env.NAMESPACE }} \
      #       --from-literal=host="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['host'])")" \
      #       --from-literal=username="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
      #       --from-literal=password="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
      #       --dry-run=client -o yaml | kubectl apply -f -

      #     # PostgreSQL secret for orders service
      #     PG_SECRET=$(aws secretsmanager get-secret-value \
      #       --secret-id "project-bedrock/postgresql" \
      #       --region ${{ env.REGION }} \
      #       --query SecretString --output text)

      #     kubectl create secret generic retail-store-orders-db \
      #       --namespace ${{ env.NAMESPACE }} \
      #       --from-literal=host="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['host'])")" \
      #       --from-literal=username="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
      #       --from-literal=password="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
      #       --dry-run=client -o yaml | kubectl apply -f -

      #     echo "Kubernetes Secrets created ✓"

      - name: Install AWS Load Balancer Controller
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          CLUSTER="${{ env.CLUSTER_NAME }}"
          REGION="${{ env.REGION }}"

          echo "Cluster: $CLUSTER"
          echo "Region: $REGION"
          echo "Account: $ACCOUNT_ID"

          VPC_ID=$(aws eks describe-cluster \
            --name "$CLUSTER" \
            --region "$REGION" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text)

          OIDC_URL=$(aws eks describe-cluster \
            --name "$CLUSTER" \
            --region "$REGION" \
            --query "cluster.identity.oidc.issuer" \
            --output text | sed 's|https://||')

          ALB_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/project-bedrock-alb-controller-role"

          echo "VPC: $VPC_ID"
          echo "OIDC: $OIDC_URL"
          echo "ALB Role: $ALB_ROLE_ARN"

          aws iam update-assume-role-policy \
            --role-name project-bedrock-alb-controller-role \
            --policy-document "{
              \"Version\": \"2012-10-17\",
              \"Statement\": [{
                \"Effect\": \"Allow\",
                \"Principal\": {
                  \"Federated\": \"arn:aws:iam::${ACCOUNT_ID}:oidc-provider/${OIDC_URL}\"
                },
                \"Action\": \"sts:AssumeRoleWithWebIdentity\",
                \"Condition\": {
                  \"StringEquals\": {
                    \"${OIDC_URL}:sub\": \"system:serviceaccount:kube-system:aws-load-balancer-controller\",
                    \"${OIDC_URL}:aud\": \"sts.amazonaws.com\"
                  }
                }
              }]
            }"

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER" \
            --set serviceAccount.create=true \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN" \
            --set region="$REGION" \
            --set vpcId="$VPC_ID" \
            --set enableCertManager=false \
            --set webhookTLS.autogenerate=true \
            --wait \
            --timeout 10m

          echo "AWS Load Balancer Controller deployment completed."

          kubectl rollout status \
            deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=5m

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller

      - name: Get DynamoDB table name
        id: dynamo
        run: |
          TABLE=$(aws dynamodb list-tables \
            --region ${{ env.REGION }} \
            --query "TableNames[?contains(@, 'carts')]" \
            --output text)
          echo "table=$TABLE" >> $GITHUB_OUTPUT
      - name: Fix ALB Controller webhook
        run: |
          kubectl delete mutatingwebhookconfiguration \
            aws-load-balancer-webhook --ignore-not-found=true
          kubectl rollout restart deployment \
            aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment \
            aws-load-balancer-controller -n kube-system \
            --timeout=3m

      - name: Deploy retail-store-sample-app
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          curl -L https://github.com/aws-containers/retail-store-sample-app/releases/latest/download/kubernetes.yaml \
            | sed 's/namespace: default/namespace: ${{ env.NAMESPACE }}/g' \
            | kubectl apply -n ${{ env.NAMESPACE }} -f -
          kubectl wait --for=condition=available deployments --all \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m
      - name: Configure service endpoints 
        run: |
          # Wait for ui configmap to exist
          echo "Waiting for ui configmap..."
          for i in {1..20}; do
          kubectl get configmap ui \
          -n ${{ env.NAMESPACE }} &>/dev/null && break
          echo "Attempt $i/20 — waiting 10s..."
          sleep 10
          done

          # Fix UI configmap to use correct service names
          kubectl patch configmap ui \
            -n ${{ env.NAMESPACE }} \
            --patch '{
              "data": {
                "ENDPOINTS_CATALOG":  "http://catalog:80",
                "ENDPOINTS_CARTS":    "http://carts:80",
                "ENDPOINTS_ORDERS":   "http://orders:80",
                "ENDPOINTS_CHECKOUT": "http://checkout:80",
                "ENDPOINTS_ASSETS":   "http://assets:80"
              }
            }'

            #Fix catalog → RDS MySQL
          MYSQL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "project-bedrock/mysql" \
            --region ${{ env.REGION }} \
            --query SecretString --output text)

          kubectl set env deployment/catalog \
            -n ${{ env.NAMESPACE }} \
            --env="DB_ENDPOINT=$(echo $MYSQL_SECRET | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':3306')")" \
            --env="DB_READ_ENDPOINT=$(echo $MYSQL_SECRET | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':3306')")" \
            --env="DB_USER=$(echo $MYSQL_SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
            --env="DB_PASSWORD=$(echo $MYSQL_SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
            --env="DB_NAME=catalog"

          # Fix orders → RDS PostgreSQL
          PG_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "project-bedrock/postgresql" \
            --region ${{ env.REGION }} \
            --query SecretString --output text)

          kubectl set env deployment/orders \
            -n ${{ env.NAMESPACE }} \
            --env="DB_ENDPOINT=$(echo $PG_SECRET | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':5432')")" \
            --env="DB_READ_ENDPOINT=$(echo $PG_SECRET | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host']+':5432')")" \
            --env="DB_USER=$(echo $PG_SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
            --env="DB_PASSWORD=$(echo $PG_SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
            --env="DB_NAME=orders"

          # Fix carts → DynamoDB
          kubectl set env deployment/carts \
            -n ${{ env.NAMESPACE }} \
            --env="CARTS_DYNAMODB_TABLE_NAME=project-bedrock-carts" \
            --env="AWS_REGION=${{ env.REGION }}" \
            --env="SPRING_PROFILES_ACTIVE=dynamodb"

          # Restart all deployments to pick up new config
          kubectl rollout restart deployment/ui \
            deployment/catalog \
            deployment/orders \
            deployment/carts \
            -n ${{ env.NAMESPACE }}

          # Wait for rollouts to complete
          kubectl rollout status deployment/ui \
            -n ${{ env.NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/catalog \
            -n ${{ env.NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/orders \
            -n ${{ env.NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/carts \
            -n ${{ env.NAMESPACE }} --timeout=3m

          echo "All service endpoints configured ✓"
      - name: Apply Ingress and NetworkPolicies
        run: |
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/network-policies.yaml

      - name: Open ALB port 80
        run: |
          sleep 30
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --region ${{ vars.AWS_REGION }} \
            --query "LoadBalancers[?contains(DNSName,'retailst')].LoadBalancerArn" \
            --output text)
          ALB_SG=$(aws elbv2 describe-load-balancers \
            --region ${{ vars.AWS_REGION }} \
            --load-balancer-arns "$ALB_ARN" \
            --query "LoadBalancers[0].SecurityGroups[0]" \
            --output text)
          aws ec2 authorize-security-group-ingress \
            --group-id "$ALB_SG" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0 \
            --region ${{ vars.AWS_REGION }} 2>/dev/null || true
          echo "Port 80 opened on $ALB_SG ✓"

      - name: Wait for ALB and post summary
        run: |
          echo "Waiting for ALB..."
          ALB_HOSTNAME=""
          for i in {1..24}; do
            ALB_HOSTNAME=$(kubectl get ingress retail-store-ingress \
              -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [[ -n "$ALB_HOSTNAME" ]] && break
            echo "Attempt $i/24 — waiting 15s..."
            sleep 15
          done

          echo "## App Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | retail-store-sample-app v${{ env.CHART_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${{ env.NAMESPACE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ALB URL | http://$ALB_HOSTNAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Pods | $(kubectl get pods -n ${{ env.NAMESPACE }} --no-headers | wc -l) running |" >> $GITHUB_STEP_SUMMARY

      - name: Verify pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
